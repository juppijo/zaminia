<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine Seite</title>
<style>
body {
  font-family: sans-serif;
  margin: 40px;
  color: #222222;
  background: #fdfdfd;
}
h1 {
  color: #c9a227;
}

</head>
<body>
<h1>Willkommen</h1>
  
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Vorlesefunktion mit schöner Stimme</title>
</head>
<body>

    <p id="vorlese-text">Hallo! Dies ist ein Beispieltext, der von einer natürlichen Stimme vorgelesen wird.</p>
    <button onclick="textVorlesen()">Vorlesen starten</button>

    <script>
        function textVorlesen() {
            // Prüfen, ob der Browser die Funktion unterstützt
            if ('speechSynthesis' in window) {
                const text = document.getElementById('vorlese-text').innerText;
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Sprache auf Deutsch setzen
                utterance.lang = 'de-DE';
                
                // Verfügbare Stimmen laden und eine natürliche (z.B. Google oder Microsoft) wählen
                const stimmen = window.speechSynthesis.getVoices();
                const deutscheStimme = stimmen.find(s => s.lang.includes('de') && (s.name.includes('Natural') || s.name.includes('Google') || s.name.includes('Online')));
                
                if (deutscheStimme) {
                    utterance.voice = deutscheStimme;
                }

                // Vorlesevorgang starten
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Ihr Browser unterstützt keine Vorlesefunktion.');
            }
        }

        // Stimmen werden manchmal async geladen
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>

</body>
</html>


</body>
</html>
